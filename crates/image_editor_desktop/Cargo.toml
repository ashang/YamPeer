[package]
name = "image_editor_desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Desktop host boundary for Image Editor"

[[bin]]
name = "image-editor"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "generate-capabilities"
path = "src/bin/generate_capabilities.rs"

[features]
# Default Cargo builds, including `cargo run --release`, may load the checked-in
# resource when no installable package has been staged. Release package commands
# use `--no-default-features` and therefore cannot fall back to a build tree.
default = ["portable-codecs", "native-window", "development-font-fallback"]
development-font-fallback = []
native-window = ["dep:eframe", "dep:ttf-parser"]
portable-codecs = ["image_editor_codecs/portable-codecs"]
heic = ["image_editor_codecs/heic"]
macos-dialogs = ["image_editor_platform/macos-dialogs"]
xdg-portal = ["image_editor_platform/xdg-portal"]
gtk = ["image_editor_platform/gtk"]

[dependencies]
eframe = { workspace = true, optional = true }
ttf-parser = { workspace = true, optional = true }
image_editor_codecs = { path = "../image_editor_codecs", default-features = false }
image_editor_core = { path = "../image_editor_core" }
image_editor_platform = { path = "../image_editor_platform" }
sha2.workspace = true
